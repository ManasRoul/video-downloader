<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Media Downloader</title>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    
    h1 {
      font-size: 18px;
      margin: 0 0 10px 0;
      color: #333;
    }
    
    .status {
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    
    .status.connected {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #4caf50;
    }
    
    .status.disconnected {
      background-color: #ffebee;
      color: #c62828;
      border: 1px solid #f44336;
    }
    
    .info {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 15px;
    }
    
    .button {
      background-color: #2196F3;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-size: 14px;
    }
    
    .button:hover {
      background-color: #1976D2;
    }
    
    .button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    
    .icon {
      font-size: 48px;
      text-align: center;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1>📥 Media Downloader</h1>
  
  <div id="status" class="status disconnected">
    Checking connection...
  </div>
  
  <div class="icon">🎬</div>
  
  <div class="info">
    This extension detects media playback in your browser and allows you to download videos and audio files.
    <br><br>
    <strong>How to use:</strong>
    <ol style="margin: 5px 0; padding-left: 20px;">
      <li>Make sure the Media Downloader app is running</li>
      <li>Play a video or audio file</li>
      <li>Click the download notification</li>
    </ol>
  </div>
  
  <button id="testButton" class="button" disabled>
    Test Connection
  </button>
  
  <script src="popup.js"></script>
</body>
</html>
